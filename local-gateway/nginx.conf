# Gateway mínimo para pruebas locales — cumple el mismo rol que API Gateway en AWS: le da al frontend
# un solo punto de entrada, en vez de que tenga que conocer el puerto de cada microservicio. No valida
# JWT (eso lo hace cada microservicio igual, y el API Gateway real en AWS) — es solo enrutamiento + CORS.
#
# CORS es obligatorio acá: el frontend (http://localhost:5173) y este gateway (http://localhost:8090)
# son orígenes distintos para el navegador, aunque `curl` no lo note (CORS solo lo aplica el browser).

server {
    listen 80;

    # Se resuelve en runtime en vez de al cargar la config, para que si algún backend tarda en levantar
    # nginx no se caiga por "host not found" al arrancar.
    resolver 127.0.0.11 valid=30s;

    location /usuarios {
        add_header Access-Control-Allow-Origin "http://localhost:5173" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }

        set $upstream http://ms-usuarios:8081;
        proxy_pass $upstream;
        proxy_set_header Authorization $http_authorization;
    }

    location /subastas {
        add_header Access-Control-Allow-Origin "http://localhost:5173" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }

        set $upstream http://ms-catalogo:8082;
        proxy_pass $upstream;
        proxy_set_header Authorization $http_authorization;
    }

    location /lotes {
        add_header Access-Control-Allow-Origin "http://localhost:5173" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }

        set $upstream http://ms-catalogo:8082;
        proxy_pass $upstream;
        proxy_set_header Authorization $http_authorization;
    }

    location /pujas {
        add_header Access-Control-Allow-Origin "http://localhost:5173" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }

        set $upstream http://ms-pujas:8083;
        proxy_pass $upstream;
        proxy_set_header Authorization $http_authorization;
    }
}

  #     - subastalive-net

  # ms-pujas:
  #   build:
  #     context: ./ms-pujas
  #   container_name: subastalive-ms-pujas
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     DB_HOST: postgres
  #     DB_PORT: 5432
  #     DB_NAME: subastalive
  #     DB_USERNAME: subastalive
  #     DB_PASSWORD: subastalive
  #     DB_POOL_MAX_SIZE: 5
  #     JWT_ISSUER_URI_COGNITO: ""
  #     JWT_ISSUER_URI_ENTRA: ""
  #     MS_CATALOGO_BASE_URL: "http://ms-catalogo:8082"
  #     SERVER_PORT: 8083
  #   ports:
  #     - "8083:8083"
  #   networks:
  #     - subastalive-net

networks:
  subastalive-net:
    driver: bridge

volumes:
  postgres_data:

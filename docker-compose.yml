# Entorno local de SubastaLive — Etapa 1, todo dockerizado para probar de punta a punta.
#
# Qué es real y qué es un stub, para que quede claro qué estás probando:
#   - ms-pujas    -> implementación REAL (Spring Boot + Postgres + Flyway).
#   - ms-catalogo -> implementación REAL (Spring Boot + Postgres + Flyway), mismo patrón que ms-pujas.
#   - ms-usuarios -> implementación REAL (Node/Express + Postgres), mismo esquema compartido que los
#                    otros dos servicios (sin Flyway: aplica su V1__init.sql a mano al arrancar).
#   - frontend    -> real, tal como se despliega, en modo de autenticación "mock" (sin Cognito/Entra ID
#                    reales) para poder loguearse sin nada externo.
#
# Todos hablan entre sí con el token simplificado "local:<sub>:<ROL>" (ver
# ms-pujas/.../security/LocalTokenAuthFilter.java) — no es un JWT real, solo sirve para poder probar
# sin depender de AWS/Azure. En producción cada microservicio valida JWT real (ver sus README).
#
# Uso:
#   docker compose up -d --build   # construye las imágenes que falten y levanta todo
#   docker compose down            # detiene todo, conserva los datos de Postgres
#   docker compose down -v         # detiene todo y borra el volumen de la base (reinicia desde cero)
#
# Una vez arriba: http://localhost:5173 (frontend, ya hablando con los backends reales/stub de verdad).

services:
  postgres:
    image: postgres:16-alpine
    container_name: subastalive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: subastalive
      POSTGRES_USER: subastalive
      POSTGRES_PASSWORD: subastalive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subastalive -d subastalive"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - subastalive-net

  adminer:
    image: adminer:latest
    container_name: subastalive-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    networks:
      - subastalive-net

  ms-pujas:
    build:
      context: ./ms-pujas
    container_name: subastalive-ms-pujas
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: subastalive
      DB_USERNAME: subastalive
      DB_PASSWORD: subastalive
      DB_POOL_MAX_SIZE: 5
      MS_CATALOGO_BASE_URL: http://ms-catalogo:8082
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    networks:
      - subastalive-net

  ms-catalogo:
    build:
      context: ./ms-catalogo
    container_name: subastalive-ms-catalogo
    depends_on:
      postgres:
        condition: service_healthy
      ms-pujas:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: subastalive
      DB_USERNAME: subastalive
      DB_PASSWORD: subastalive
      DB_POOL_MAX_SIZE: 5
      MS_PUJAS_BASE_URL: http://ms-pujas:8083
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    networks:
      - subastalive-net

  ms-usuarios:
    build:
      context: ./ms-usuarios
    container_name: subastalive-ms-usuarios
    depends_on:
      postgres:
        condition: service_healthy
      ms-pujas:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: subastalive
      DB_USERNAME: subastalive
      DB_PASSWORD: subastalive
      DB_POOL_MAX_SIZE: 5
      MS_PUJAS_BASE_URL: http://ms-pujas:8083
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - subastalive-net

  local-gateway:
    image: nginx:alpine
    container_name: subastalive-local-gateway
    depends_on:
      - ms-usuarios
      - ms-catalogo
      - ms-pujas
    volumes:
      - ./local-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    networks:
      - subastalive-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH_MODE: mock
        VITE_USE_MOCKS: "false"
        VITE_API_BASE_URL: http://localhost:8090
    container_name: subastalive-frontend
    depends_on:
      - local-gateway
    ports:
      - "5173:80"
    networks:
      - subastalive-net

networks:
  subastalive-net:
    driver: bridge

volumes:
  postgres_data:

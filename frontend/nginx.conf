server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de SPA: si el archivo no existe, cae a index.html para que React Router resuelva la ruta
    # en el cliente (equivalente al custom error response 403/404 que se usaría con CloudFront).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # El nombre de estos archivos cambia con el hash del contenido en cada build (index-XXXX.js), así
    # que un cache-control agresivo acá es seguro: si el contenido cambia, la URL también cambia.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

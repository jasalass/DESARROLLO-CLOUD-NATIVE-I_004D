# Build + deploy del frontend como sitio estático (S3 + CloudFront), según la sección 6.3 del plan.
#
# Se activa con push a main que toque algo dentro de frontend/ (o manualmente desde la pestaña Actions).
# La invalidación de CloudFront es opcional: si no se define la variable CLOUDFRONT_DISTRIBUTION_ID,
# ese paso se salta (por ejemplo, si todavía solo se sirve desde el bucket S3 sin CDN delante).
#
# Prerrequisitos de infraestructura y la lista completa de Secrets/Variables están documentados en el
# README principal, sección "CI/CD — despliegue automático a AWS".

name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET_FRONTEND }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      - name: Configurar credenciales AWS (laboratorio AWS Academy — ver README)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sincronizar el build al bucket S3
        run: |
          aws s3 sync ./dist "s3://$S3_BUCKET" --delete

      - name: Invalidar caché de CloudFront (si hay distribución configurada)
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
